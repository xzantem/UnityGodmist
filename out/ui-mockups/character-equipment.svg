      <text x="1152" y="812" class="text">Po trafieniu moze nalozyc </text>
      <text x="1372" y="812" class="keyword">Krwawienie</text>
      <text x="1152" y="838" class="text">i wspiera agresywny styl gry oparty o mobilnosc.</text>

